- id: tls.weak-cipher
  title: 暗号強度の低いスイートで接続できました
  severity: LOW
  confidence: medium
  requires:
    - proof
    - consent
  collectors:
    - tls
  when:
    obs:
      collector: tls
      path: cipher_bits
      op: lt
      value: 128
  message: ネゴシエートされた暗号スイートの鍵長が 128 bit 未満です。
  why: 鍵長が短いと総当たりの余地が増えます。実際の強度はスイート全体で決まるため、鍵長だけで断定はできません。
  fix: 128 bit 以上のスイートだけを許可します。
  verify: 再診断で cipher_bits が 128 以上になることを確認します。
  tags:
    - tls