<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ログイン</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 4rem auto; max-width: 22rem; padding: 0 1rem; }
  label { display: block; margin-top: 1rem; font-weight: bold; }
  input[type="password"] { width: 100%; padding: .4rem; }
  .error { background: #fde2e1; padding: .6rem 1rem; }
  button { margin-top: 1.2rem; padding: .5rem 1.4rem; }
</style>
</head>
<body>
<h1>RiskTrace</h1>

{% if error %}<p class="error">{{ error }}</p>{% endif %}

<form method="post" action="/v2/login">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label for="password">パスワード</label>
  <input type="password" id="password" name="password" required>
  <button type="submit">入る</button>
</form>
</body>
</html>
